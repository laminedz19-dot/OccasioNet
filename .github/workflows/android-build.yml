name: OccasioNet Dual Android Build & Test

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build OccasioNet User & Admin APKs
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v6

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: 4. Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: 5. Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v6

      - name: 6. Verify Wrapper and Java Versions
        run: |
          set -euo pipefail
          test -x ./gradlew
          ./gradlew --version

      - name: 7. Prepare Safe Environment File (No service_role secrets)
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cp .env.example .env
          if [ -n "$SUPABASE_URL_SECRET" ] && [ -n "$SUPABASE_ANON_KEY_SECRET" ]; then
            printf 'SUPABASE_URL=%s\nURL=%s\n' "$SUPABASE_URL_SECRET" "$SUPABASE_URL_SECRET" > .env
            printf 'SUPABASE_ANON_KEY=%s\nANON_KEY=%s\n' "$SUPABASE_ANON_KEY_SECRET" "$SUPABASE_ANON_KEY_SECRET" >> .env
          fi

      - name: 8. Generate CI Debug Keystore
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 9. Run Unit & Security Tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          :core:testDebugUnitTest
          :userApp:testDebugUnitTest
          :adminApp:testDebugUnitTest

      - name: 10. Run Android Lint
        run: >-
          ./gradlew --no-daemon --stacktrace
          :core:lintDebug
          :userApp:lintDebug
          :adminApp:lintDebug

      - name: 11. Build OccasioNet User APK (:userApp)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :userApp:assembleDebug
          mkdir -p dist
          cp userApp/build/outputs/apk/debug/userApp-debug.apk dist/OccasioNet-User-debug.apk
          test -s dist/OccasioNet-User-debug.apk
          unzip -tq dist/OccasioNet-User-debug.apk

      - name: 12. Build OccasioNet Admin APK (:adminApp)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :adminApp:assembleDebug
          cp adminApp/build/outputs/apk/debug/adminApp-debug.apk dist/OccasioNet-Admin-debug.apk
          test -s dist/OccasioNet-Admin-debug.apk
          unzip -tq dist/OccasioNet-Admin-debug.apk

      - name: 13. Upload OccasioNet User APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: OccasioNet-User-debug-apk
          path: dist/OccasioNet-User-debug.apk
          if-no-files-found: error

      - name: 14. Upload OccasioNet Admin APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: OccasioNet-Admin-debug-apk
          path: dist/OccasioNet-Admin-debug.apk
          if-no-files-found: error
