name: OccasioNet Dual Android Build & Test

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build OccasioNet User & Admin APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: 4. Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v6

      - name: 5. Prepare Safe Environment File (No service_role secrets)
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SUPABASE_URL_SECRET" ] && [ -n "$SUPABASE_ANON_KEY_SECRET" ]; then
            echo "SUPABASE_URL=$SUPABASE_URL_SECRET" > .env
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY_SECRET" >> .env
          fi

      - name: 6. Generate CI Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 7. Run Unit & Security Tests (Core, UserApp, AdminApp)
        run: gradle :core:testDebugUnitTest :app:testDebugUnitTest :adminApp:testDebugUnitTest

      - name: 8. Build OccasioNet User APK (:userApp)
        run: |
          gradle :userApp:assembleDebug
          mkdir -p dist
          cp userApp/build/outputs/apk/debug/userApp-debug.apk dist/OccasioNet-User-debug.apk

      - name: 9. Build OccasioNet Admin APK (:adminApp)
        run: |
          gradle :adminApp:assembleDebug
          mkdir -p dist
          cp adminApp/build/outputs/apk/debug/adminApp-debug.apk dist/OccasioNet-Admin-debug.apk

      - name: 10. Upload OccasioNet-User-debug.apk Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OccasioNet-User-debug-apk
          path: dist/OccasioNet-User-debug.apk
          if-no-files-found: error

      - name: 11. Upload OccasioNet-Admin-debug.apk Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OccasioNet-Admin-debug-apk
          path: dist/OccasioNet-Admin-debug.apk
          if-no-files-found: error

      - name: 12. Enable KVM for Android Emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "KVM device is unavailable on this runner; UI tests cannot start an x86_64 emulator."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: 13. Run User & Admin UI Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest :adminApp:connectedDebugAndroidTest

      - name: 14. Collect Android UI Test Diagnostics
        if: ${{ failure() }}
        run: |
          adb devices -l || true
          adb -s emulator-5554 shell getprop || true
          adb -s emulator-5554 logcat -d -b all -v time || true
